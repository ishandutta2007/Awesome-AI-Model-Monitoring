<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="brightGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes floatLine{0%{stroke-dashoffset:1000}}@keyframes wave{0%{d:path(&quot;M 0 320 Q 300 280 600 320 T 1200 320 L 1200 400 L 0 400 Z&quot;)}50%{d:path(&quot;M 0 320 Q 300 350 600 300 T 1200 330 L 1200 400 L 0 400 Z&quot;)}}.bg-grid{animation:pulse 6s ease-in-out infinite}.glowing-node{animation:pulse 3s ease-in-out infinite}.sub-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800}.sub-text{font-weight:500}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)"/><rect width="1200" height="400" fill="url(#grid)" class="bg-grid"/><circle cx="150" cy="100" r="180" fill="#4f46e5" filter="url(#brightGlow)" opacity=".15"/><circle cx="1050" cy="300" r="200" fill="#ec4899" filter="url(#brightGlow)" opacity=".12"/><path fill="none" stroke="url(#accentGrad)" stroke-width="3" d="M 50 280 Q 200 220 350 270 T 650 230 T 950 290 L 1150 210" filter="url(#glow)" opacity=".5"/><path fill="none" stroke="#38bdf8" stroke-dasharray="8 6" stroke-width="2" d="M 50 310 Q 250 260 450 330 T 750 270 T 1050 320 L 1150 280" opacity=".4"/><circle cx="350" cy="270" r="6" fill="#a855f7" class="glowing-node" filter="url(#glow)"/><circle cx="650" cy="230" r="7" fill="#ec4899" class="glowing-node" filter="url(#glow)"/><circle cx="950" cy="290" r="6" fill="#38bdf8" class="glowing-node" filter="url(#glow)"/><g transform="translate(600, 75)"><rect width="280" height="36" x="-140" y="-18" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)" rx="18"/><text x="0" y="5" fill="#38bdf8" class="sub-text" font-size="14" letter-spacing="2" text-anchor="middle">🤖 MLOPS &amp; LLM OBSERVABILITY</text></g><text x="600" y="165" fill="#fff" class="title-text" filter="url(#glow)" font-size="52" letter-spacing="-1" text-anchor="middle">Awesome AI Model Monitoring</text><text x="600" y="215" fill="#94a3b8" class="sub-text" font-size="20" text-anchor="middle">Curated List of SaaS Platforms &amp; Open-Source Tools for Production AI Health</text><g><g transform="translate(600, 280) translate(-270, 0)"><rect width="180" height="32" x="-90" y="-16" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="16"/><text x="0" y="5" fill="#e2e8f0" class="sub-text" font-size="13" text-anchor="middle">📉 Drift Detection</text></g><g transform="translate(600, 280) translate(-90, 0)"><rect width="160" height="32" x="-80" y="-16" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="16"/><text x="0" y="5" fill="#e2e8f0" class="sub-text" font-size="13" text-anchor="middle">⚡ Performance</text></g><g transform="translate(600, 280) translate(80, 0)"><rect width="160" height="32" x="-80" y="-16" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="16"/><text x="0" y="5" fill="#e2e8f0" class="sub-text" font-size="13" text-anchor="middle">🔍 LLM Evals</text></g